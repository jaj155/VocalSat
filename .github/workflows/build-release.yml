name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check environment
        run: |
          cmake --version
          where cmake
      - name: Configure
        run: cmake -S . -B build
      - name: Build VST3
        run: cmake --build build --config Release --target VocalSat_VST3 2>&1 | Tee-Object -FilePath build.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-logs
          path: build.log
      - name: Build Standalone
        run: cmake --build build --config Release --target VocalSat_Standalone
      - uses: actions/upload-artifact@v7
        with:
          name: windows-VocalSat
          path: build/*_artefacts/Release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
      - name: Build VST3
        run: cmake --build build --config Release --target VocalSat_VST3 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-logs
          path: build.log
      - name: Build Standalone
        run: cmake --build build --config Release --target VocalSat_Standalone
      - uses: actions/upload-artifact@v7
        with:
          name: macos-VocalSat
          path: build/*_artefacts/Release/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libfreetype6-dev \
            libgl1-mesa-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev \
            libwebkit2gtk-4.1-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --target VocalSat_VST3 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-logs
          path: build.log
      - name: Build Standalone
        run: cmake --build build --target VocalSat_Standalone
      - uses: actions/upload-artifact@v7
        with:
          name: linux-VocalSat
          path: build/*_artefacts/*
