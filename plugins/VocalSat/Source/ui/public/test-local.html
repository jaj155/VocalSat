<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocalSat</title>
<!-- webview-008 / webview-011: every stylesheet and script is inline. -->
<style>


:root {
  
  --cols: 50;
  --rows: 27.5;

  
  --apc-letterbox: #000;

  
  --plate:      #1a1a1f;
  --plate-2:    #232329;
  --surface:    #101014;
  --inset:      #0a0a0d;
  --rule:       #3a3a45;
  --rule-2:     #2a2a33;
  --ink:        #f0f0f5;
  --ink-2:      #a0a0a5;
  --accent:     #ffc300;
  --grip-ink:   #4a4a55;

  --r-control:  4px;
  --r-panel:    6px;
  --font-ui:    "Roboto Mono", ui-monospace, monospace;

  --sh-recess:  inset 0 1px 3px rgba(0,0,0,.55);
  --sh-raised:  0 1px 0 rgba(255,255,255,.06), 0 3px 6px rgba(0,0,0,.35);
}


html {
  font-size: min(calc(100vw / var(--cols)), calc(100vh / var(--rows)));
}
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--apc-letterbox);
  font-family: var(--font-ui);
  -webkit-user-select: none;
  user-select: none;
}


.apc-plate {
  position: relative;
  width:  calc(var(--cols) * 1rem);
  height: calc(var(--rows) * 1rem);
  background: var(--plate);
  overflow: hidden;
}


.apc-plate .apc-cell { position: absolute; box-sizing: border-box; }
.apc-cell { box-sizing: border-box; }


.apc-grip {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 2.5rem;
  height: 2.5rem;
  cursor: nwse-resize;
  touch-action: none;
  z-index: 90;
}
.apc-grip::before {
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
  background:
    repeating-linear-gradient(-45deg,
      var(--grip-ink) 0 1px,
      transparent 1px calc(.375rem));
  opacity: .8;
}
.apc-grip:hover::before { opacity: 1; }


.apc-section {
  position: absolute;
  box-sizing: border-box;
  background: var(--plate-2);
  border: 1px solid var(--rule-2);
  border-radius: var(--r-panel);
}




.apc-micro  { font-size: max(9px, .5rem);  }
.apc-label  { font-size: max(10px, .625rem); }
.apc-readout{ font-size: max(11px, .75rem); }




.apc-knob { display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.apc-knob-dial {
  position: relative;
  flex: 1;
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, var(--plate-2), var(--inset) 75%);
  border: 1px solid var(--rule);
  box-shadow: var(--sh-raised);
}
.apc-knob-pointer {
  position: absolute;
  left: 50%; top: 8%;
  width: max(1px, .09rem);
  height: 30%;
  background: var(--accent);
  transform-origin: 50% 140%;
  transform: translateX(-50%) rotate(-135deg);
}
.apc-knob-label, .apc-ctl-label {
  font-size: var(--t-label, .5rem);
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-2);
  white-space: nowrap;
}


.apc-sec-tag {
  position: absolute; left: .375rem; top: .1875rem;
  font-size: .4rem; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-2); opacity: .55;
  white-space: nowrap; pointer-events: none;
}


.apc-flip { display: flex; flex-direction: column; align-items: center; gap: .1875rem; }
.apc-flip-cap {
  position: relative;
  flex: 1;
  width: 100%;
  min-height: 1.25rem;
  border: 1px solid var(--rule);
  border-radius: var(--r-control);
  background: var(--plate-2);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--t-value, .625rem);
  font-weight: 600;
  letter-spacing: .1em;
  cursor: pointer;
  box-shadow: var(--sh-raised);
}
.apc-flip-cap::after {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit; pointer-events: none;
  box-shadow: var(--sh-recess); opacity: .4;
}
.apc-flip-cap:active { filter: brightness(1.15); }


.apc-psw {
  display: flex; align-items: center; justify-content: center;
  gap: .375rem;
  border: 1px solid var(--rule);
  border-radius: var(--r-control);
  background: var(--plate-2);
  color: var(--ink-2);
  font-family: var(--font-ui);
  font-size: var(--t-label, .5rem);
  font-weight: 600;
  letter-spacing: .14em;
  cursor: pointer;
  box-shadow: var(--sh-raised);
}
.apc-psw .led {
  width: .5rem; height: .5rem; border-radius: 50%;
  background: var(--ink-2); opacity: .35;
}
.apc-psw[aria-checked="true"] { color: var(--ink); }
.apc-psw[aria-checked="true"] .led {
  background: var(--accent); opacity: 1;
  box-shadow: 0 0 .5rem var(--accent);
}


.apc-fader { display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.apc-fader-track {
  position: relative; flex: 1; width: .375rem;
  background: var(--inset); border-radius: 2px;
  box-shadow: var(--sh-recess);
}
.apc-fader-cap {
  position: absolute; left: 50%; top: 20%;
  width: 1.5rem; height: .625rem;
  transform: translate(-50%, -50%);
  background: var(--plate-2);
  border: 1px solid var(--rule);
  border-radius: 2px;
  box-shadow: var(--sh-raised);
}


.apc-screen {
  display: flex; align-items: center; justify-content: center;
  background: var(--inset);
  border-radius: 3px;
  box-shadow: var(--sh-recess);
  color: var(--accent);
  font-size: var(--t-readout, .6875rem);
  font-weight: 600;
  letter-spacing: .08em;
  font-variant-numeric: tabular-nums;
}


.apc-well {
  position: relative; overflow: hidden;
  background: var(--inset);
  border-radius: var(--r-control);
}
.apc-well::after {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit; box-shadow: var(--sh-recess);
  pointer-events: none; z-index: 2;
}
.apc-well canvas { position: absolute; inset: 0; width: 100%; height: 100%; }


.apc-chip {
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule-2);
  border-radius: 2px;
  background: var(--plate-2);
  color: var(--ink-2);
  font-family: var(--font-ui);
  font-size: var(--t-micro, .4375rem);
  font-weight: 600;
  letter-spacing: .1em;
  cursor: pointer;
}
.apc-chip:hover { border-color: var(--accent); color: var(--accent); }


:root {
  --cols: 45;
  --rows: 30;
  --apc-letterbox: var(--surface);

  --plate: #2a2621;
  --plate-2: #34302a;
  --surface: #121010;
  --inset: #0d0b09;
  --rule: #5c5245;
  --rule-2: #403930;
  --ink: #f4e9d4;
  --ink-2: #b9a888;
  --accent: #ffb347;
  --grip-ink: #6d5f4b;
  --font-ui: "Bahnschrift", "Segoe UI", ui-sans-serif, sans-serif;
  --t-label: .625rem;
  --t-value: .75rem;
  --t-readout: .8125rem;
  --t-micro: .4375rem;
  --day-meter-face: #efe4c8;
  --meter-ink: #3b3327;
  --meter-accent: #b8862f;
  --meter-brand: VU;
}

.apc-knob {
  cursor: ns-resize;
  touch-action: none;
}
.apc-knob:focus { outline: none; }
.apc-knob:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-control);
}
.apc-knob-pointer { transition: transform 90ms linear; }
.apc-knob:hover .apc-knob-pointer { background: #ffd28a; }
.apc-knob.is-dragging .apc-knob-dial {
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, .55);
}

.apc-plate.is-bypassed .apc-knob,
.apc-plate.is-bypassed .apc-screen { opacity: .6; }

.apc-psw { cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  .apc-knob-pointer { transition: none; }
}

</style>
</head>
<body>
<div class="apc-plate">
    <div class="apc-cell apc-section" id="sec-mast" style="left:0.5rem;top:0.5rem;width:44rem;height:3.25rem;"><span class="apc-sec-tag"></span></div>
    <div class="apc-cell apc-section" id="sec-meter-bay" style="left:1.5rem;top:4rem;width:22.5rem;height:13.5rem;"><span class="apc-sec-tag">METER</span></div>
    <div class="apc-cell apc-section" id="sec-notes" style="left:1.5rem;top:18rem;width:22.5rem;height:6rem;"><span class="apc-sec-tag">CHARACTER</span></div>
    <div class="apc-cell apc-section" id="sec-controls" style="left:24.75rem;top:4rem;width:19.75rem;height:20rem;"><span class="apc-sec-tag">SATURATION</span></div>
    <div class="apc-cell apc-section" id="sec-footer" style="left:0.5rem;top:25.75rem;width:44rem;height:3.75rem;"><span class="apc-sec-tag">ANALOG WARMTH</span></div>

    <div class="apc-cell apc-well" id="cv-meter" style="left:3rem;top:5.5rem;width:20rem;height:10.5rem;"><canvas></canvas></div>

    <div class="apc-cell apc-ctl-label" id="ctl-brand" style="left:2rem;top:1.25rem;width:16rem;height:1.75rem;">VOCALSAT</div>
    <div class="apc-cell apc-ctl-label" id="ctl-tagline" style="left:27rem;top:1.25rem;width:16rem;height:1.75rem;">ANALOG WARMTH</div>

    <div class="apc-cell apc-knob" id="ctl-drive" data-param="drive" role="slider" tabindex="0"
         aria-label="Drive" aria-valuemin="0" aria-valuemax="24" aria-valuenow="6"
         style="left:25.5rem;top:6rem;width:6rem;height:6.5rem;">
      <div class="apc-knob-dial"><div class="apc-knob-pointer"></div></div>
      <div class="apc-ctl-label">DRIVE</div>
    </div>
    <div class="apc-cell apc-knob" id="ctl-tone" data-param="tone" role="slider" tabindex="0"
         aria-label="Tone" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"
         style="left:32rem;top:6rem;width:6rem;height:6.5rem;">
      <div class="apc-knob-dial"><div class="apc-knob-pointer"></div></div>
      <div class="apc-ctl-label">TONE</div>
    </div>
    <div class="apc-cell apc-knob" id="ctl-mix" data-param="mix" role="slider" tabindex="0"
         aria-label="Mix" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"
         style="left:38.5rem;top:6rem;width:6rem;height:6.5rem;">
      <div class="apc-knob-dial"><div class="apc-knob-pointer"></div></div>
      <div class="apc-ctl-label">MIX</div>
    </div>

    <div class="apc-cell apc-screen" id="ctl-drive-readout" style="left:25.5rem;top:13.5rem;width:6rem;height:2.25rem;">6.0 dB</div>
    <div class="apc-cell apc-screen" id="ctl-tone-readout" style="left:32rem;top:13.5rem;width:6rem;height:2.25rem;">0 %</div>
    <div class="apc-cell apc-screen" id="ctl-mix-readout" style="left:38.5rem;top:13.5rem;width:6rem;height:2.25rem;">100 %</div>

    <button class="apc-cell apc-psw" id="ctl-bypass" data-param="bypass" aria-checked="false"
            style="left:25.5rem;top:18rem;width:9rem;height:3rem;">
      <span class="led"></span><span>BYPASS</span>
    </button>

    <div class="apc-cell apc-ctl-label" id="ctl-note-1" style="left:3rem;top:19.5rem;width:19rem;height:1.25rem;">VOCAL-FIRST SATURATION</div>
    <div class="apc-cell apc-ctl-label" id="ctl-note-2" style="left:3rem;top:21.25rem;width:19rem;height:1.25rem;">AUTO GAIN COMPENSATION</div>

    <div class="apc-cell apc-ctl-label" id="ctl-footer-left" style="left:2.5rem;top:26.5rem;width:18rem;height:1.5rem;">4x OVERSAMPLING</div>
    <div class="apc-cell apc-ctl-label" id="ctl-footer-right" style="left:30rem;top:26.5rem;width:13rem;height:1.5rem;">VST3 / STANDALONE</div>

    <div class="apc-grip" id="ctl-grip" title="Drag to resize"></div>
</div>

        ctx.fillStyle = labels[j] >= 0 ? red : ink;
        ctx.fillText(labels[j] > 0 ? "+" + labels[j] : "" + labels[j],
                     cx + Math.cos(la) * R * 0.76,
                     cy + Math.sin(la) * R * 0.76);
      }

      ctx.fillStyle = ink;
      ctx.globalAlpha = 0.8;
      ctx.font = "bold " + Math.round(R * 0.16) + "px sans-serif";
      ctx.fillText(brand, cx, cy - R * 0.60);
      ctx.font = Math.round(R * 0.072) + "px sans-serif";
      ctx.fillText("CHANNEL VOCAL", cx, cy - R * 0.46);
      ctx.globalAlpha = 1;

      var na = ang(Math.max(-20, Math.min(3, current)));
      ctx.strokeStyle = ink;
      ctx.lineWidth = R * 0.018;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(na) * R * 0.68, cy + Math.sin(na) * R * 0.68);
      ctx.stroke();

      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.arc(cx, cy, R * 0.055, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = red;
      ctx.beginPath();
      ctx.arc(w - R * 0.12, h * 0.10, R * 0.035, 0, Math.PI * 2);
      ctx.fill();

      var sh = ctx.createLinearGradient(0, 0, 0, h * 0.5);
      sh.addColorStop(0, "rgba(255,255,255,.28)");
      sh.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = sh;
      ctx.fillRect(0, 0, w, h * 0.5);
    }

    var fit = window.APC.fitCanvas(canvas, paint);

    function poll() {
      if (NATIVE) {
        if (busy) return;
        busy = true;
        getMeter().then(function (m) {
          var db = (m && typeof m.rmsDb === "number") ? m.rmsDb : -100;
          target = Math.max(-20, Math.min(3, db + 18));
        }).then(function () { busy = false; });
      } else {
        var t = (performance.now() - started) / 1000;
        target = Math.max(-20, Math.min(3,
          -8 + 5.2 * Math.sin(t * 1.1) + 2.2 * Math.sin(t * 3.7)));
      }
    }

    function animate() {
      current += (target - current) * (target > current ? 0.35 : 0.08);
      fit.refit();
    }

    setInterval(poll, 33);
    setInterval(animate, 33);
    poll();
    animate();
  }

  /* ---- boot --------------------------------------------------------------- */
  function boot() {
    setupKnob("drive");
    setupKnob("tone");
    setupKnob("mix");
    setupBypass();
    setupMeter();

    var grip = document.getElementById("ctl-grip");
    if (grip && window.APC && typeof window.APC.attachGrip === "function")
      window.APC.attachGrip(grip);

    // Sync the page with the native scale preference (no-op in a browser).
    getUiPrefs().then(function (prefs) {
      if (prefs && typeof prefs.uiScale === "number")
        document.documentElement.setAttribute("data-ui-scale", String(prefs.uiScale));
    });
  }

  boot();
})();

</script>
